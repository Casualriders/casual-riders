<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0d0d;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.page{padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px;}
.logo-wrap{width:140px;height:140px;border-radius:50%;overflow:hidden;border:3px solid #D4A017;margin-bottom:1.2rem;}
.logo-wrap img{width:100%;height:100%;object-fit:cover;}
.name{font-size:22px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:1px;text-transform:uppercase;}
.tagline{font-size:12px;color:#D4A017;letter-spacing:3px;text-transform:uppercase;margin-bottom:1.75rem;}
.links{width:100%;display:flex;flex-direction:column;gap:12px;}
.link-btn{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:12px;background:#1a1a1a;border:1px solid #D4A017;color:#fff;text-decoration:none;font-size:15px;font-weight:600;letter-spacing:0.5px;transition:background 0.2s,transform 0.15s;}
.link-btn:hover{background:#262606;transform:translateY(-2px);}
.link-btn:active{transform:scale(0.98);}
.icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ig-icon{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
.ar-icon{background:#1b6b1b;}
.en-icon{background:#1a3b6b;}
.label{flex:1;}
.sublabel{font-size:11px;color:#D4A017;font-weight:400;display:block;margin-top:1px;letter-spacing:0.5px;}
.arr{color:#D4A017;font-size:20px;}
.divider{width:100%;border:none;border-top:1px solid #222;margin:14px 0;}
.motto{font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase;text-align:center;}
</style>
